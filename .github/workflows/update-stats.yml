name: Update GitHub profile cards

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-cards
  cancel-in-progress: false

jobs:
  update-cards:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=ImMacaya&show_icons=true&theme=tokyonight&hide_border=true&rank_icon=github"
          path: profile/stats.svg
          token: ${{ github.token }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=ImMacaya&layout=compact&theme=tokyonight&hide_border=true"
          path: profile/top-langs.svg
          token: ${{ github.token }}

      - name: Generate contribution streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=ImMacaya&theme=tokyonight&hide_border=true&timezone=America%2FSao_Paulo"
          path: profile/streak.svg
          token: ${{ github.token }}

      - name: Commit updated cards if changed
        run: |
          git add profile/stats.svg profile/top-langs.svg profile/streak.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GitHub profile cards"
          git push
